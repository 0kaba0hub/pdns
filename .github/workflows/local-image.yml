name: Local patched auth image

# Builds Dockerfile-auth from a given commit of local-patches and pushes it
# to GHCR under <version>-<short sha>.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build
        required: true
      version:
        description: Upstream version the patch sits on
        required: true
        default: 4.9.18

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
      - id: tag
        run: echo "tag=${{ inputs.version }}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-auth
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdns-auth:${{ steps.tag.outputs.tag }}
