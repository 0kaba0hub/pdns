name: Local patched auth image

# Builds Dockerfile-auth from BUILD_REF of local-patches and pushes it to
# GHCR under <BUILD_VERSION>-<short sha>. Runs on push to image-build, as
# workflow_dispatch needs the file on the default branch (the clean mirror).
on:
  push:
    branches: [image-build]

env:
  BUILD_REF: 1384cea
  BUILD_VERSION: 4.9.18

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          submodules: recursive
      - id: tag
        run: echo "tag=${{ env.BUILD_VERSION }}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-auth
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdns-auth:${{ steps.tag.outputs.tag }}
